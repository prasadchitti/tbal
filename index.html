<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#20232b">
  <title>TharaBalam</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="stylesheet" href="beauty.css">
<!-- Latest compiled and minified CSS -->
<link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/3.3.7/css/bootstrap.min.css" integrity="sha384-BVYiiSIFeK1dGmJRAkycuHAHRg32OmUcww7on3RYdg4Va+PmSTsz/K68vbdEjh4u" crossorigin="anonymous">
<!-- Optional theme -->
<link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/3.3.7/css/bootstrap-theme.min.css" integrity="sha384-rHyoN1iRsVXV4nD0JutlnGaslCJuC7uwjduW9SVrLvRYooPp2bWYgmgJQIXwl/Sp" crossorigin="anonymous">
<!-- Latest compiled and minified JavaScript -->
<script src="https://maxcdn.bootstrapcdn.com/bootstrap/3.3.7/js/bootstrap.min.js" integrity="sha384-Tc5IQib027qvyjSMfHjOMaLkfuWVxZxUPnCJA7l2mCWNIpG9mGCD8wGNIcPD7Txa" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/astronomy-engine@2.1.19/astronomy.browser.min.js"></script>
<script src="goodday.js"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
</head>
<style>
  html {
    background: rgb(40,44,52);
  }

  body {
    background: radial-gradient(circle at top, #333947 0%, rgb(40,44,52) 60%);
    background-attachment: fixed;
    color: whitesmoke;
    min-height: 100vh;
    margin: 0;
    overflow-x: hidden;
  }

  .app-shell {
    max-width: 720px;
    margin: 0 auto;
    padding: 40px 20px 60px;
  }

  .app-header {
    text-align: center;
    margin-bottom: 28px;
  }

  .app-header h1 {
    font-size: 30px;
    font-weight: 600;
    letter-spacing: 0.5px;
    margin: 0;
    text-shadow: 1px 1px 3px rgba(0,0,0,.5);
  }

  .app-header p {
    color: #9aa0ac;
    margin: 6px 0 0;
    font-size: 14px;
  }

  .tab-nav {
    display: flex;
    gap: 6px;
    background: #23262f;
    padding: 6px;
    border-radius: 12px;
    margin-bottom: 22px;
    box-shadow: inset 0 1px 3px rgba(0,0,0,.4);
  }

  .tab-btn {
    flex: 1;
    border: none;
    background: transparent;
    color: #9aa0ac;
    padding: 12px 16px;
    border-radius: 9px;
    font-size: 15px;
    cursor: pointer;
    transition: background .2s ease, color .2s ease, box-shadow .2s ease;
  }

  .tab-btn:hover {
    color: whitesmoke;
  }

  .tab-btn.active {
    background: linear-gradient(135deg, #5b6ee8, #7b8ff2);
    color: #fff;
    box-shadow: 0 3px 10px rgba(91,110,232,.45);
  }

  .tab-btn i {
    margin-right: 6px;
  }

  .tab-pane {
    display: none;
  }

  .tab-pane.active {
    display: block;
    animation: fadeIn .25s ease;
  }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(6px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .card {
    background: #282c34;
    border: 1px solid #383d47;
    border-radius: 14px;
    padding: 26px 24px;
    box-shadow: 0 6px 20px rgba(0,0,0,.3);
  }

  .card h2 {
    margin-top: 0;
    font-size: 22px;
  }

  .card label {
    color: #c7ccd6;
    font-weight: 600;
    font-size: 13px;
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }

  .card .form-control {
    background: #1f2229;
    border: 1px solid #3a3f4b;
    color: whitesmoke;
    box-shadow: none;
    margin-bottom: 14px;
    width: 100%;
    max-width: 100%;
  }

  input[type="date"].form-control {
    -webkit-appearance: none;
    appearance: none;
  }

  .card .form-control:focus {
    border-color: #7b8ff2;
    box-shadow: 0 0 0 3px rgba(123,143,242,.25);
  }

  .card .form-control::placeholder {
    color: #6b7280;
  }

  .card .btn-primary {
    background: linear-gradient(135deg, #5b6ee8, #7b8ff2);
    border: none;
    margin-right: 8px;
    margin-bottom: 8px;
    box-shadow: 0 2px 8px rgba(91,110,232,.35);
  }

  .card .btn-primary:hover,
  .card .btn-primary:focus {
    background: linear-gradient(135deg, #4d5fe0, #6c81f0);
  }

  .card .btn-copy {
    background: transparent;
    border: 1px solid #5b6ee8;
    color: #b9c2ff;
    margin-right: 8px;
    margin-bottom: 8px;
  }

  .card .btn-copy:hover,
  .card .btn-copy:focus {
    background: rgba(91,110,232,.18);
    color: #fff;
  }

  .thara-result {
    background-color: #333;
    color: whitesmoke;
    padding: 15px;
    border-radius: 8px;
    margin-top: 16px;
    min-height: 24px;
  }

  .thara-result h3 {
    margin: 0;
  }

  .tithi-result {
    background-color: #333;
    color: whitesmoke;
    padding: 15px;
    border-radius: 8px;
    margin-top: 16px;
  }

  .tithi-result .tithi-entry {
    margin-bottom: 12px;
  }

  .tithi-result .tithi-entry:last-child {
    margin-bottom: 0;
  }

  .tithi-result .tithi-name {
    font-weight: bold;
    color: gold;
  }

  .tithi-result .tithi-summary {
    margin-bottom: 12px;
  }

  .tithi-result h4 {
    color: gold;
    margin: 10px 0 8px 0;
    border-bottom: 1px solid #555;
    padding-bottom: 4px;
  }

  * {
    box-sizing: border-box;
  }

  @media (max-width: 480px) {
    .app-shell {
      padding: 24px 12px 40px;
    }

    .app-header h1 {
      font-size: 24px;
    }

    .app-header p {
      font-size: 13px;
    }

    .tab-btn {
      font-size: 13px;
      padding: 10px 6px;
    }

    .card {
      padding: 18px 16px;
    }

    .card .btn-primary,
    .card .btn-copy {
      width: 100%;
      margin-right: 0;
    }
  }

  .app-footer {
    text-align: center;
    margin-top: 32px;
    color: #6b7280;
    font-size: 13px;
  }
  </style>
<body>
<div class="app-shell">

  <div class="app-header">
    <h1><i class="fa fa-star"></i> Panchangam</h1>
    <p>Thara Balam compatibility &amp; Panchangam Finder</p>
  </div>

  <div class="tab-nav">
    <button type="button" class="tab-btn active" id="tabBtnTithi" onclick="showTab('tithi');">
      <i class="fa fa-moon-o"></i>Day Finder
    </button>
    <button type="button" class="tab-btn" id="tabBtnThara" onclick="showTab('thara');">
      <i class="fa fa-cog"></i>Thara Balam
    </button>
  </div>

  <div id="tabTithi" class="tab-pane active">
    <div class="card">
      <h2><i class="fa fa-moon-o"></i> Panchangam Finder</h2>
      <label for="tithiDate">Select date:</label>
      <input type="date" id="tithiDate" name="tithiDate" class="form-control">
      <button type="button" class="btn btn-primary" onclick="getTithi();">Get Panchangam</button>
      <button type="button" class="btn btn-copy" id="copyPanchangamBtn" onclick="copyPanchangam();">
        <i class="fa fa-clipboard"></i> Copy
      </button>
      <button type="button" class="btn btn-copy" id="sharePanchangamBtn" onclick="sharePanchangam();" style="display:none;">
        <i class="fa fa-share-alt"></i> Share
      </button>
      <div id="tithiResult" class="tithi-result"></div>
    </div>
  </div>

  <div id="tabThara" class="tab-pane">
    <div class="card">
      <h2><i class="fa fa-cog fa-spin"></i> Thara Balam</h2>
      <label for="str1">Star from:</label>
      <input type="text" id="str1" name="str1" placeholder="From this star" class="form-control" list="starlist"/>
      <label for="str2">Star to:</label>
      <input type="str2" id="str2" name="str2" placeholder="To this star" class="form-control" list="starlist">
      <button type="button" class="btn btn-primary" onclick="getstarindex();">Get Result</button>
      <button type="button" class="btn btn-primary" onclick="resetdata();">Reset data</button>
      <button type="button" class="btn btn-primary" onclick="swap();">Swap</button>
      <div class="thara-result">
        <h3 id="thara"></h3>
      </div>
    </div>

    <datalist id="starlist">
        <option value="aswini"/>
        <option value ="bharani"/>
        <option value ="krithika"/>
        <option value ="rohini"/>
        <option value ="mrugasira"/>
        <option value ="arudra"/>
        <option value ="punarvasu"/>
        <option value ="pushyami"/>
        <option value ="aslesha"/>
        <option value ="makha"/>
        <option value ="pubha"/>
        <option value ="uthara"/>
        <option value ="hastha"/>
        <option value ="chitha"/>
        <option value ="swathi"/>
        <option value ="visakha"/>
        <option value ="anuradha"/>
        <option value ="jyestha"/>
        <option value ="moola"/>
        <option value ="poorvashada"/>
        <option value ="utharashada"/>
        <option value ="sravanam"/>
        <option value ="dhanista"/>
        <option value ="sathabhisham"/>
        <option value ="purvabadra"/>
        <option value ="utharabadra"/>
        <option value ="revathi"/>
    </datalist>
  </div>

  <footer class="app-footer">
    &copy; <span id="copyrightYear"></span> Prasad Chitti
  </footer>

</div>
</body>

</html>
